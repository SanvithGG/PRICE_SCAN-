<div class="min-h-screen bg-[#08090b] text-[#f3f4f6] font-sans antialiased selection:bg-[#d4ff00] selection:text-black flex flex-col">
  
  <!-- TOP NAVIGATION HEADER BAR (Aligned to max-w-6xl container) -->
  <header class="sticky top-0 z-40 bg-[#08090b]/95 backdrop-blur-md border-b border-[#16181f]">
    <div class="w-full max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center gap-3 text-left group focus:outline-none cursor-pointer">
        <div class="w-8 h-8 rounded-md bg-[#d4ff00] flex items-center justify-center text-black font-black text-lg tracking-tight shadow-[0_0_12px_rgba(212,255,0,0.3)]">
          <svg class="w-5 h-5 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </div>
        <span class="font-display font-extrabold text-xl tracking-tight text-white">
          PRICE<span class="text-[#d4ff00]">/</span>SCAN
        </span>
      </a>

      <!-- Topbar Actions -->
      <div class="flex items-center gap-6 text-xs font-bold tracking-wider uppercase">
        <button 
          (click)="ps.toggleBulkModal(true)" 
          class="flex items-center gap-2 text-[#9ca3af] hover:text-white transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4 text-[#d4ff00]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
          </svg>
          Bulk
        </button>

        <ng-container *ngIf="!ps.loggedIn; else userLoggedIn">
          <a 
            routerLink="/login" 
            class="text-[#9ca3af] hover:text-white transition-colors cursor-pointer"
          >
            Log in
          </a>
          <a 
            routerLink="/signup" 
            class="px-4 py-2 bg-[#d4ff00] text-black font-extrabold rounded hover:bg-[#e0ff33] transition-all shadow-[0_0_12px_rgba(212,255,0,0.25)] cursor-pointer"
          >
            Sign up
          </a>
        </ng-container>

        <ng-template #userLoggedIn>
          <div class="flex items-center gap-3">
            <span class="text-xs text-[#9ca3af] font-normal lowercase bg-[#12141a] px-3 py-1.5 rounded border border-[#202430]">
              {{ ps.user() }}
            </span>
            <button 
              (click)="ps.logout()" 
              class="text-xs text-red-400 hover:text-red-300 transition-colors cursor-pointer"
            >
              Sign out
            </button>
          </div>
        </ng-template>
      </div>

    </div>
  </header>

  <!-- ANGULAR ROUTER OUTLET -->
  <router-outlet></router-outlet>

  <!-- BULK SCAN MODAL -->
  <div *ngIf="ps.showBulkModal()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-[#090a0c] border border-[#1e222d] rounded-xl max-w-xl w-full p-6 space-y-6 shadow-2xl animate-modal-pop animate-scanline">
      <div class="flex items-center justify-between border-b border-[#181b24] pb-4">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#d4ff00] animate-pulse"></span>
          <h3 class="font-display font-extrabold text-xl text-white">Bulk Price Scanner</h3>
        </div>
        <button (click)="ps.toggleBulkModal(false)" class="text-[#8b929e] hover:text-white text-xl transition-colors cursor-pointer w-8 h-8 rounded-lg hover:bg-[#161822] flex items-center justify-center">✕</button>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-mono text-[#8b929e]">Enter product items to scan (one per line):</label>
        <textarea
          [value]="ps.bulkInput()"
          (input)="ps.bulkInput.set($any($event.target).value)"
          rows="5"
          placeholder="watch&#10;iPhone 15&#10;Sony WH-1000XM5&#10;MacBook Air"
          class="w-full bg-[#040507] text-white border border-[#1a1d26] focus:border-[#d4ff00] rounded-lg p-3 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-[#d4ff00] transition-all"
        ></textarea>
      </div>

      <button (click)="ps.runBulkScan()" class="w-full btn-shimmer text-black font-mono font-bold text-xs uppercase py-3.5 rounded-lg cursor-pointer shadow-[0_0_15px_rgba(212,255,0,0.25)] hover:scale-[1.01] active:scale-[0.99] transition-all">
        Scan All Items
      </button>

      <div *ngIf="ps.bulkResults().length > 0" class="space-y-2 pt-2 border-t border-[#181b24] animate-card-enter" style="animation-delay: 100ms">
        <h4 class="text-xs font-mono font-bold text-[#d4ff00] uppercase tracking-wider">Bulk Results Winner Table</h4>
        <div class="bg-[#040507] border border-[#181b24] rounded-lg overflow-hidden font-mono text-xs divide-y divide-[#181b24]">
          <div *ngFor="let item of ps.bulkResults(); let idx = index" class="flex items-center justify-between p-3 hover:bg-[#0d0e14] transition-colors animate-card-enter" [style.animation-delay]="(idx * 60) + 'ms'">
            <span class="text-white font-bold flex items-center gap-2">
              <span class="text-[#d4ff00]">#{{ idx + 1 }}</span>
              {{ item.query }}
            </span>
            <div class="flex items-center gap-3">
              <span class="text-[#8b929e] text-[11px] bg-[#12141c] px-2 py-0.5 rounded border border-[#1e2230]">{{ item.store }}</span>
              <span class="text-[#d4ff00] font-extrabold">${{ item.bestPrice }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
